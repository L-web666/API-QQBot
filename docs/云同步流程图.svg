<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2000" viewBox="0 0 1280 2000" font-family="Microsoft YaHei UI, Microsoft YaHei, Segoe UI, sans-serif">
<defs>
  <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#5a6684"/>
  </marker>
  <marker id="ar2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#b07d16"/>
  </marker>
</defs>
<rect x="0" y="0" width="1280" height="2000" fill="#f5f7fd"/>
<text x="640.0" y="46" font-size="26" font-weight="bold" fill="#1c2740" text-anchor="middle" opacity="1">QQ AI Bot · 云同步全流程</text>
<text x="640.0" y="72" font-size="13.5" font-weight="normal" fill="#5a6684" text-anchor="middle" opacity="1">core/cloud_sync.py + qqbot.py 挂载点（Cloudflare D1）</text>
<rect x="40" y="100" width="1200" height="40" rx="10" fill="#4f5ae6" opacity="0.10"/>
<text x="60" y="127" font-size="17" font-weight="bold" fill="#4f5ae6" text-anchor="start" opacity="1">① 启动阶段（不再阻塞拉取：只做准备；连上 QQ 后才同步）</text>
<text x="1240" y="127" font-size="12.5" font-weight="normal" fill="#5a6684" text-anchor="end" opacity="1">QQAIbot.__init__()</text>
<rect x="320" y="156" width="640" height="54" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="182" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">读取 config.json / 建日志</text>
<text x="640.0" y="202" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">ConfigManager 加载配置 → Logger 建立 data/logs</text>
<line x1="640" y1="210" x2="640" y2="224" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="224" width="640" height="74" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="250" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">校验凭据</text>
<text x="640.0" y="270" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">qq.app_id / app_secret 必填（缺失则拒绝启动）</text>
<text x="640.0" y="290" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">AI 三项可选；ai.enabled=false 也能跑</text>
<line x1="640" y1="298" x2="640" y2="312" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="312" width="640" height="74" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="338" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">_init_cloud_sync()</text>
<text x="640.0" y="358" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">读 cloud_sync 段 → 建 D1Backend（★ 启动阶段 0 次网络请求）</text>
<text x="640.0" y="378" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">未启用 → 跳过；凭据不全 → WARNING 后跳过</text>
<line x1="640" y1="386" x2="640" y2="400" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="400" width="640" height="94" rx="12" fill="#eef1fb" stroke="#c9d3f2" stroke-width="1.6"/>
<text x="640.0" y="426" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">★ 启动写缓存开启</text>
<text x="640.0" y="446" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">data/ 下的数据改动先记在内存里（日志等不上云的文件除外，立即落盘）</text>
<text x="640.0" y="466" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">避免刚启动时写的旧数据/默认值把云端数据覆盖掉</text>
<text x="640.0" y="486" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">未启用云同步 → 完全不生效，也不会有任何提示</text>
<line x1="640" y1="494" x2="640" y2="508" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="508" width="640" height="54" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="534" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">WARNING：数据可能不是最新的</text>
<text x="640.0" y="554" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">其它服务器的改动还没拉取；连上 QQ 后立即同步一次</text>
<line x1="640" y1="562" x2="640" y2="576" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="576" width="640" height="74" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="602" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">_init_modules()</text>
<text x="640.0" y="622" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">上下文 / 统计 / 插件加载；插件的启动写入被缓存（还没落盘）</text>
<text x="640.0" y="642" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">★ 程序内读取能看到缓存内容，逻辑前后一致</text>
<line x1="640" y1="650" x2="640" y2="664" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="664" width="640" height="54" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="690" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">run()：连接 QQ</text>
<text x="640.0" y="710" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">消息处理、热更新线程、定时任务、Web 后台</text>
<line x1="640" y1="718" x2="640" y2="732" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="732" width="640" height="74" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="758" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">连接 QQ 成功 → 第一次同步</text>
<text x="640.0" y="778" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">cloud_sync.start(immediate=True)：A→B→C→D→E 完整跑一轮</text>
<text x="640.0" y="798" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">★ 同步期间临时挂起写缓存（云同步必须看到磁盘真实状态）</text>
<line x1="640" y1="806" x2="640" y2="820" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="820" width="640" height="74" rx="12" fill="#eef7f0" stroke="#c6e3ce" stroke-width="1.6"/>
<text x="640.0" y="846" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">✅ 第一次同步已完成</text>
<text x="640.0" y="866" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">控制台 INFO 汇报 恢复/上传/删除 数量（有失败会说明，下周期重试）</text>
<text x="640.0" y="886" font-size="14.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">写回启动缓存：刚被云端恢复过的文件按「以云端为准」放弃本地改动</text>
<rect x="1000" y="330" width="240" height="168" rx="10" fill="#eef1fb" stroke="#c9d3f2"/>
<text x="1120" y="356" font-size="13.5" font-weight="bold" fill="#3f4bb8" text-anchor="middle" opacity="1">★ 启动写缓存</text>
<text x="1120" y="382" font-size="11.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">写入先留在内存里（读取能看到）</text>
<text x="1120" y="404" font-size="11.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">首次同步完成后再落盘</text>
<text x="1120" y="426" font-size="11.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">冲突默认以云端为准</text>
<text x="1120" y="448" font-size="11.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">超时/容量超限/暂停/退出 → 落盘</text>
<text x="1120" y="470" font-size="11.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">未启用云同步 → 不生效</text>
<rect x="40" y="920" width="1200" height="40" rx="10" fill="#4f5ae6" opacity="0.10"/>
<text x="60" y="947" font-size="17" font-weight="bold" fill="#4f5ae6" text-anchor="start" opacity="1">② 运行阶段（后台 daemon 线程，按时间增量写入）</text>
<text x="1240" y="947" font-size="12.5" font-weight="normal" fill="#5a6684" text-anchor="end" opacity="1">cloud_sync.start()</text>
<rect x="320" y="976" width="640" height="34" rx="12" fill="#eef1f9" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="998.0" font-size="15.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">cloud_sync.start()：daemon 线程 cloud-sync → 先等 3 秒避开启动 IO</text>
<line x1="640" y1="1010" x2="640" y2="1030" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="1032" width="1160" height="330" rx="14" fill="#ffffff" stroke="#4f5ae6" stroke-width="1.6" stroke-dasharray="8,6" opacity="0.95"/>
<text x="80" y="1058" font-size="13.5" font-weight="bold" fill="#4f5ae6" text-anchor="start" opacity="1">循环：每个周期写入一次（interval_seconds，默认 60 秒；≥60 秒对齐整点倍数，如 300 秒 → 每小时 00/05/10…分整）</text>
<rect x="80" y="1080" width="270" height="108" rx="12" fill="#fdeeee" stroke="#f3c9c9" stroke-width="1.6"/>
<text x="215.0" y="1106" font-size="13.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">A 应用云端删除标记</text>
<text x="215.0" y="1125" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">墓碑比本地文件新 → 删本地副本</text>
<text x="215.0" y="1144" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">本地比墓碑新 → 标记待"复活"上传</text>
<line x1="350" y1="1134" x2="370" y2="1134" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="372" y="1080" width="270" height="108" rx="12" fill="#fff7e6" stroke="#f5d28e" stroke-width="1.6"/>
<text x="507.0" y="1106" font-size="13.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">B 本地删除 → 写墓碑</text>
<text x="507.0" y="1125" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">本地"同步过但现在没了"→ 写删除标记</text>
<text x="507.0" y="1144" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">key + deleted=1 + 删除时间（毫秒）</text>
<line x1="642" y1="1134" x2="662" y2="1134" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="664" y="1080" width="270" height="108" rx="12" fill="#eef7f0" stroke="#c6e3ce" stroke-width="1.6"/>
<text x="799.0" y="1106" font-size="13.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">C 上传（有改动才写）</text>
<text x="799.0" y="1125" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">★ 云端副本更新 → 本轮不上传（改用云端版本）</text>
<text x="799.0" y="1144" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">毫秒级 mtime+大小 比对 → 批量 INSERT</text>
<line x1="934" y1="1134" x2="954" y2="1134" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="956" y="1080" width="270" height="108" rx="12" fill="#eef1fb" stroke="#c9d3f2" stroke-width="1.6"/>
<text x="1091.0" y="1106" font-size="13.5" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">D 下载 / E 清理墓碑</text>
<text x="1091.0" y="1125" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">只下载 deleted=0 的记录（墓碑跳过）</text>
<text x="1091.0" y="1144" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">过期墓碑按 tombstone_days 清理</text>
<path d="M 1091.0 1188 L 1091.0 1260 L 215.0 1260 L 215.0 1188" fill="none" stroke="#b07d16" stroke-width="2" stroke-dasharray="7,6" marker-end="url(#ar2)"/>
<text x="640" y="1282" font-size="13" font-weight="normal" fill="#8a6d1a" text-anchor="middle" opacity="1">等到下一个时间点 → 下一周期（没有改动的周期完全不写数据库，省额度）</text>
<rect x="80" y="1296" width="350" height="56" rx="12" fill="#eef7f0" stroke="#c6e3ce" stroke-width="1.6"/>
<text x="255.0" y="1322" font-size="13" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">状态页按钮：</text>
<text x="255.0" y="1340" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">🔌 测试连接 / ⬆️ 立即同步一次 / ⏸ 解除暂停</text>
<rect x="465" y="1296" width="350" height="56" rx="12" fill="#eef1fb" stroke="#c9d3f2" stroke-width="1.6"/>
<text x="640.0" y="1322" font-size="13" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">配置热更新：</text>
<text x="640.0" y="1340" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">cloud_sync 有变化 → 停旧线程(末次同步) → 重建 → 重启</text>
<rect x="850" y="1296" width="370" height="56" rx="12" fill="#fff7e6" stroke="#f5d28e" stroke-width="1.6"/>
<text x="1035.0" y="1322" font-size="13" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">失败处理：</text>
<text x="1035.0" y="1340" font-size="12.5" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">记 WARNING，下个周期自动重试；连续 3 次 → ERROR + 暂停</text>
<rect x="40" y="1376" width="1200" height="40" rx="10" fill="#4f5ae6" opacity="0.10"/>
<text x="60" y="1403" font-size="17" font-weight="bold" fill="#4f5ae6" text-anchor="start" opacity="1">③ 退出阶段（保证最新数据已上云）</text>
<text x="1240" y="1403" font-size="12.5" font-weight="normal" fill="#5a6684" text-anchor="end" opacity="1">stop()</text>
<rect x="320" y="1432" width="640" height="40" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="1457.0" font-size="14" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">停止配置热更新 / 定时任务线程</text>
<line x1="640" y1="1472" x2="640" y2="1484" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="1484" width="640" height="40" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="1509.0" font-size="14" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">停止 Web 管理后台</text>
<line x1="640" y1="1524" x2="640" y2="1536" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="1536" width="640" height="56" rx="12" fill="#eef7f0" stroke="#c6e3ce" stroke-width="1.6"/>
<text x="640.0" y="1562" font-size="14" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">cloud_sync.stop(final_sync=True)</text>
<text x="640.0" y="1582" font-size="14" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">停线程 + 再做一次完整同步；没同步成功的启动缓存在此写回磁盘</text>
<line x1="640" y1="1592" x2="640" y2="1604" stroke="#5a6684" stroke-width="2" marker-end="url(#ar)"/>
<rect x="320" y="1604" width="640" height="40" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.6"/>
<text x="640.0" y="1629.0" font-size="14" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">停止消息处理器 → 断开 QQ → 程序已停止</text>
<text x="1000" y="1550" font-size="12.5" font-weight="normal" fill="#b0413f" text-anchor="start" opacity="1">崩溃 / kill -9 不会走到这里</text>
<text x="1000" y="1572" font-size="12.5" font-weight="normal" fill="#b0413f" text-anchor="start" opacity="1">→ 启动缓存最长等 startup_buffer_minutes（默认 3 分钟）</text>
<rect x="40" y="1676" width="1200" height="40" rx="10" fill="#4f5ae6" opacity="0.10"/>
<text x="60" y="1703" font-size="17" font-weight="bold" fill="#4f5ae6" text-anchor="start" opacity="1">④ 同步范围与冲突规则</text>
<text x="1240" y="1703" font-size="12.5" font-weight="normal" fill="#5a6684" text-anchor="end" opacity="1">贯穿全流程</text>
<rect x="40" y="1728" width="290" height="190" rx="12" fill="#eef7f0" stroke="#c6e3ce" stroke-width="1.6"/>
<text x="185.0" y="1754" font-size="14" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">✅ 会上云</text>
<text x="185.0" y="1776" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">user_context/**（私聊/群聊上下文、bindings.json）</text>
<text x="185.0" y="1798" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">stats.json（统计）</text>
<text x="185.0" y="1820" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">plugins_data/**（插件数据）</text>
<text x="185.0" y="1842" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">plugins_disabled.json / command_panel.json</text>
<rect x="350" y="1728" width="290" height="190" rx="12" fill="#fdeeee" stroke="#f3c9c9" stroke-width="1.6"/>
<text x="495.0" y="1754" font-size="14" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">❌ 永不上云</text>
<text x="495.0" y="1776" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">config.json、config配置说明文件.txt（含密钥）</text>
<text x="495.0" y="1798" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">bot.lock、bot.pid（运行期文件）</text>
<text x="495.0" y="1820" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">.cloud_sync_state.json、_test*、*.tmp</text>
<text x="495.0" y="1842" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">data/logs/**（默认不上云，upload_logs=true 才开）</text>
<rect x="660" y="1728" width="290" height="190" rx="12" fill="#eef1fb" stroke="#c9d3f2" stroke-width="1.6"/>
<text x="805.0" y="1754" font-size="14" font-weight="bold" fill="#22304f" text-anchor="middle" opacity="1">⚖️ 删除墓碑机制</text>
<text x="805.0" y="1776" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">删除 = 写入带时间戳的标记（deleted=1），不硬删行</text>
<text x="805.0" y="1798" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">本地副本更旧 → 同步删除本地（可关闭）</text>
<text x="805.0" y="1820" font-size="12" font-weight="normal" fill="#3d4a68" text-anchor="middle" opacity="1">本地副本更新 → 保留并上传，覆盖墓碑（复活）</text>
